# Salve como .github/workflows/app-release-signed.yml no SEU fork (Zhes-20/GameNativeETXR).
# Versão do CI do GameNative adaptada para fork: não precisa de nenhum secret.
name: Android CI (fork)

on:
  push:
    branches: [ "etxr/**", "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      flavors:
        description: "Sabores a compilar, separados por vírgula (LegacyXr, Legacy, Modern)"
        default: "LegacyXr"
      apply_mods:
        description: "Aplicar a pasta mods/ (patches, overlay, run.sh) antes de compilar"
        type: boolean
        default: true
      submodules:
        description: "Baixar submódulos (best-effort; alguns links estão mortos)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    # O CI original não baixa submódulos. Alguns estão quebrados (ex.: PancakeTAS/dxbc não existe mais),
    # então por padrão ficam de fora. Só ligue se o build reclamar de arquivos nativos faltando.
    - name: Submódulos (opcional)
      env:
        SUBS: ${{ inputs.submodules }}
      run: |
        if [ "${SUBS:-false}" = "true" ]; then
          git submodule update --init --recursive || echo "::warning::Alguns submódulos falharam (ex.: PancakeTAS/dxbc)"
        else
          echo "Sem submódulos (igual ao CI original)."
        fi

    - name: Add swap
      run: |
        sudo fallocate -l 8G /mnt/swapfile.ci
        sudo chmod 600 /mnt/swapfile.ci
        sudo mkswap /mnt/swapfile.ci
        sudo swapon /mnt/swapfile.ci
        free -m

    # Mudar / criar código antes do build. Ordem: mods/patches/*.patch, mods/overlay/, mods/run.sh
    - name: Aplicar modificações (mods/)
      env:
        APPLY: ${{ inputs.apply_mods }}
      run: |
        set -euo pipefail
        if [ "${APPLY:-true}" != "true" ] || [ ! -d mods ]; then echo "Sem mods, compilando o código como está."; exit 0; fi
        if [ -d mods/patches ]; then
          for p in $(ls mods/patches/*.patch 2>/dev/null | sort); do
            echo "== patch: $p"; git apply --verbose --whitespace=nowarn "$p"
          done
        fi
        if [ -d mods/overlay ]; then echo "== overlay"; cp -rv mods/overlay/. .; fi
        if [ -f mods/run.sh ]; then echo "== run.sh"; bash mods/run.sh; fi

    - name: set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Se você cadastrou os secrets KEYSTORE* usa eles (assim o APK atualiza por cima do anterior).
    # Se não, gera uma chave nova nesta execução (funciona, mas cada build tem assinatura diferente).
    - name: Configure Keystores
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
      run: |
        set -euo pipefail
        mkdir -p app/keystores
        if [ -n "${KEYSTORE:-}" ]; then
          echo "Usando keystore dos secrets"
          echo "$KEYSTORE" | base64 --decode > app/keystores/keystore
          ALIAS="$KEYSTORE_KEY_ALIAS"; KPASS="$KEYSTORE_KEY_PASSWORD"; SPASS="$KEYSTORE_STORE_PASSWORD"
        else
          echo "Sem secrets: gerando keystore temporária"
          ALIAS="etxr"; KPASS="$(openssl rand -hex 16)"; SPASS="$KPASS"
          keytool -genkeypair -keystore app/keystores/keystore -storepass "$SPASS" -keypass "$KPASS" \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ETXR,O=ETXR,C=BR"
        fi
        echo "::add-mask::$KPASS"; echo "::add-mask::$SPASS"
        # o Gradle do projeto espera os dois conjuntos (debug e prod): usamos a mesma chave nos dois
        cp app/keystores/keystore app/keystores/prod.keystore
        {
          echo "storeFile=keystores/keystore"
          echo "keyAlias=$ALIAS"
          echo "storePassword=$SPASS"
          echo "keyPassword=$KPASS"
        } > app/keystores/keystore.properties
        {
          echo "keyAlias=$ALIAS"
          echo "keyPassword=$KPASS"
          echo "storePassword=$SPASS"
        } > app/keystores/prod-keystore.properties
        {
          echo "SIGN_ALIAS=$ALIAS"; echo "SIGN_KEY_PASS=$KPASS"; echo "SIGN_STORE_PASS=$SPASS"
        } >> "$GITHUB_ENV"

    # Só escreve a chave se o secret existir. Valor vazio no local.properties gera
    # "String X = ;" no BuildConfig e o javac quebra; sem a linha, o Gradle usa o padrão do projeto.
    - name: Inject credentials
      env:
        POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        CLOUD_PROJECT_NUMBER: ${{ secrets.CLOUD_PROJECT_NUMBER }}
      run: |
        : > local.properties
        for k in POSTHOG_API_KEY POSTHOG_HOST STEAMGRIDDB_API_KEY CLOUD_PROJECT_NUMBER; do
          v="${!k:-}"
          if [ -n "$v" ]; then echo "$k=$v" >> local.properties; fi
        done
        echo "local.properties:"; sed 's/=.*/=***/' local.properties || true

    - name: Install Android SDK Build Tools
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        yes | "$SDKMANAGER" --install "build-tools;34.0.0" > /dev/null

    - name: Build bundles and universal APKs
      env:
        FLAVORS: ${{ inputs.flavors }}
      run: |
        set -euo pipefail
        mkdir -p out
        BT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/34.0.0"
        ls tools/bundletool-all-*.jar
        BUNDLETOOL="$(ls tools/bundletool-all-*.jar | head -1)"
        for F in $(echo "${FLAVORS:-LegacyXr}" | tr ',' ' '); do
          F="$(echo "$F" | tr -d ' ')"
          LF="$(echo "${F:0:1}" | tr '[:upper:]' '[:lower:]')${F:1}"
          echo "=============== $F ==============="
          ./gradlew -Pkotlin.daemon.jvmargs=-Xmx3g ":app:bundle${F}Release"
          ./gradlew --stop
          AAB="$(ls app/build/outputs/bundle/${LF}Release/*.aab | head -1)"
          java -jar "$BUNDLETOOL" build-apks --bundle="$AAB" --output="out/$F.apks" --mode=universal
          unzip -p "out/$F.apks" universal.apk > "out/$F-unsigned.apk"
          "$BT/apksigner" sign \
            --ks app/keystores/keystore \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass pass:"$SIGN_STORE_PASS" \
            --key-pass pass:"$SIGN_KEY_PASS" \
            --out "out/GameNativeETXR-$F.apk" "out/$F-unsigned.apk"
          "$BT/apksigner" verify "out/GameNativeETXR-$F.apk"
          rm -f "out/$F.apks" "out/$F-unsigned.apk" out/*.idsig
        done
        ls -lh out
        free -m

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: out/*.apk
        retention-days: 14
